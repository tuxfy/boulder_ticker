name: CI/CD

on:
  push:
    branches: [main]
  pull_request:

# Rechte für den GitHub-Pages-Deploy
permissions:
  contents: read
  pages: write
  id-token: write

# Parallele Deploys vermeiden (laufenden Deploy nicht abbrechen)
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm install

      - name: Install Playwright browser
        run: npx playwright install --with-deps chromium

      - name: Run E2E tests
        run: npm test

      - name: Upload report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7

  deploy:
    needs: test
    # Deploy nur bei Push auf main – nicht bei Pull Requests
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - name: Prepare Pages artifact
        # Gesamtes Repo-Root veröffentlichen (Parität zum bisherigen Branch-Deploy),
        # ohne VCS-/Dev-Artefakte
        run: |
          mkdir -p _site
          rsync -a --exclude='.git' --exclude='_site' --exclude='node_modules' ./ _site/

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
