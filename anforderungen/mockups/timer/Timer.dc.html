<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;500;600;700;800&display=swap">
<style>body{margin:0;background:#0d0e0d;font-family:'Archivo',system-ui,sans-serif;-webkit-font-smoothing:antialiased}a{color:#9fd3b0}a:hover{color:#cdebd6}button{font-family:inherit}</style>
</helmet>
<div style="max-width:430px;height:100vh;min-height:640px;margin:0 auto;display:flex;flex-direction:column;background:{{ bg }};transition:background 600ms ease;color:#f3f4f2;overflow:hidden">
  <header style="display:flex;align-items:center;justify-content:space-between;padding:18px 20px 8px">
    <div style="font-size:17px;font-weight:700;letter-spacing:-0.01em">Timer</div>
    <button style="height:40px;padding:0 14px;border-radius:12px;border:1px solid rgba(255,255,255,0.10);background:rgba(255,255,255,0.06);color:#e6e8e5;font-size:14px;font-weight:600;cursor:pointer;display:flex;align-items:center;gap:8px" style-hover="background:rgba(255,255,255,0.12)">
      <span style="display:grid;grid-template-columns:5px 5px;gap:2px"><span style="width:5px;height:5px;border-radius:1px;background:currentColor"></span><span style="width:5px;height:5px;border-radius:1px;background:currentColor"></span><span style="width:5px;height:5px;border-radius:1px;background:currentColor"></span><span style="width:5px;height:5px;border-radius:1px;background:currentColor"></span></span>
      Tools
    </button>
  </header>
  <div style="display:flex;justify-content:center;gap:28px;padding:32px 20px 0;font-size:16px;font-weight:600;color:rgba(255,255,255,0.6);letter-spacing:0.04em;text-transform:uppercase">
    <span>Runde <span style="color:#fff;font-variant-numeric:tabular-nums">{{ roundLabel }}</span></span>
    <span>Satz <span style="color:#fff;font-variant-numeric:tabular-nums">{{ setLabel }}</span></span>
  </div>
  <main style="flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:28px;padding:0 20px">
    <div style="position:relative;width:300px;height:300px;max-width:78vw;max-height:78vw">
      <svg viewBox="0 0 300 300" style="width:100%;height:100%;transform:rotate(-90deg)">
        <circle cx="150" cy="150" r="138" fill="none" stroke="rgba(255,255,255,0.08)" stroke-width="10"></circle>
        <circle cx="150" cy="150" r="138" fill="none" stroke="{{ accent }}" stroke-width="10" stroke-linecap="round" stroke-dasharray="867.08" stroke-dashoffset="{{ dashOffset }}" style="transition:stroke-dashoffset 120ms linear, stroke 600ms ease"></circle>
      </svg>
      <div style="position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px">
        <div style="font-size:15px;font-weight:800;letter-spacing:0.28em;padding-left:0.28em;color:{{ accent }};transition:color 600ms ease">{{ phaseLabel }}</div>
        <div style="font-size:88px;font-weight:800;letter-spacing:-0.04em;line-height:1;font-variant-numeric:tabular-nums">{{ timeText }}</div>
        <div style="font-size:14px;font-weight:500;color:rgba(255,255,255,0.55)">{{ subLabel }}</div>
      </div>
    </div>
    <div style="display:flex;gap:6px;width:100%;max-width:300px">
      <sc-for list="{{ segments }}" as="seg" hint-placeholder-count="5">
        <div style="flex:1;height:6px;border-radius:3px;background:rgba(255,255,255,0.1);overflow:hidden">
          <div style="height:100%;width:{{ seg.fill }};background:{{ seg.color }};border-radius:3px;transition:width 120ms linear"></div>
        </div>
      </sc-for>
    </div>
    <div style="min-height:44px;display:flex;align-items:center;gap:10px;padding:0 16px;border-radius:12px;background:rgba(0,0,0,0.22);font-size:14px;font-weight:500;color:rgba(255,255,255,0.7)">
      <span style="width:8px;height:8px;border-radius:50%;background:{{ nextColor }}"></span>
      <span>{{ nextText }}</span>
    </div>
  </main>
  <footer style="display:grid;grid-template-columns:64px 1fr 64px;align-items:center;gap:16px;padding:16px 20px 32px">
    <button onClick="{{ reset }}" aria-label="Reset" style="height:64px;border-radius:20px;border:1px solid rgba(255,255,255,0.10);background:rgba(255,255,255,0.06);color:#ff8a7a;font-size:12px;font-weight:700;cursor:pointer;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px" style-hover="background:rgba(255,255,255,0.12)">
      <span style="font-size:22px;line-height:1">↺</span>Reset
    </button>
    <button onClick="{{ toggle }}" style="height:72px;border-radius:24px;border:none;background:{{ accent }};color:#0d120e;font-size:19px;font-weight:800;cursor:pointer;display:flex;align-items:center;justify-content:center;gap:12px;transition:background 600ms ease, transform 120ms ease" style-active="transform:scale(0.97)">
      <sc-if value="{{ running }}" hint-placeholder-val="{{ false }}">
        <span style="display:flex;gap:5px"><span style="width:6px;height:20px;border-radius:2px;background:#0d120e"></span><span style="width:6px;height:20px;border-radius:2px;background:#0d120e"></span></span>
      </sc-if>
      <sc-if value="{{ notRunning }}" hint-placeholder-val="{{ true }}">
        <span style="width:0;height:0;border-top:11px solid transparent;border-bottom:11px solid transparent;border-left:18px solid #0d120e"></span>
      </sc-if>
      <span>{{ toggleLabel }}</span>
    </button>
    <button onClick="{{ skip }}" aria-label="Überspringen" style="height:64px;border-radius:20px;border:1px solid rgba(255,255,255,0.10);background:rgba(255,255,255,0.06);color:#e6e8e5;font-size:12px;font-weight:700;cursor:pointer;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px" style-hover="background:rgba(255,255,255,0.12)">
      <span style="font-size:22px;line-height:1">⇥</span>Skip
    </button>
  </footer>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;:{&quot;width&quot;:390,&quot;height&quot;:844},&quot;workSec&quot;:{&quot;editor&quot;:&quot;int&quot;,&quot;default&quot;:20,&quot;min&quot;:5,&quot;max&quot;:600,&quot;unit&quot;:&quot;s&quot;,&quot;tsType&quot;:&quot;number&quot;},&quot;restSec&quot;:{&quot;editor&quot;:&quot;int&quot;,&quot;default&quot;:10,&quot;min&quot;:5,&quot;max&quot;:600,&quot;unit&quot;:&quot;s&quot;,&quot;tsType&quot;:&quot;number&quot;},&quot;rounds&quot;:{&quot;editor&quot;:&quot;int&quot;,&quot;default&quot;:5,&quot;min&quot;:1,&quot;max&quot;:20,&quot;tsType&quot;:&quot;number&quot;},&quot;sets&quot;:{&quot;editor&quot;:&quot;int&quot;,&quot;default&quot;:2,&quot;min&quot;:1,&quot;max&quot;:10,&quot;tsType&quot;:&quot;number&quot;}}">
class Component extends DCLogic {
  state = { idx: 0, remaining: null, running: false, started: false };
  cfg() {
    const p = this.props;
    return { work: (p.workSec ?? 20) * 1000, rest: (p.restSec ?? 10) * 1000, rounds: p.rounds ?? 5, sets: p.sets ?? 2 };
  }
  steps() {
    const c = this.cfg(), out = [];
    for (let s = 1; s <= c.sets; s++) for (let r = 1; r <= c.rounds; r++) {
      out.push({ phase: 'work', round: r, set: s, dur: c.work });
      if (!(s === c.sets && r === c.rounds)) out.push({ phase: 'rest', round: r, set: s, dur: c.rest });
    }
    return out;
  }
  componentDidMount() { this.t = setInterval(() => this.tick(), 100); }
  componentWillUnmount() { clearInterval(this.t); }
  tick() {
    if (!this.state.running) { this.last = null; return; }
    const now = Date.now(), dt = this.last ? now - this.last : 0; this.last = now;
    const steps = this.steps();
    let { idx, remaining } = this.state;
    if (remaining == null) remaining = steps[idx].dur;
    remaining -= dt;
    if (remaining <= 0) {
      if (idx + 1 >= steps.length) return this.setState({ idx: steps.length, remaining: 0, running: false });
      idx++; remaining = steps[idx].dur + remaining;
    }
    this.setState({ idx, remaining });
  }
  fmt(ms) { const s = Math.max(0, Math.ceil(ms / 1000)); return Math.floor(s / 60) + ':' + String(s % 60).padStart(2, '0'); }
  renderVals() {
    const steps = this.steps(), c = this.cfg();
    const done = this.state.idx >= steps.length;
    const step = done ? steps[steps.length - 1] : steps[this.state.idx];
    const remaining = done ? 0 : (this.state.remaining ?? step.dur);
    const prog = done ? 1 : 1 - remaining / step.dur;
    const P = {
      work: { accent: 'oklch(0.78 0.16 55)', bg: 'oklch(0.21 0.045 50)', label: 'WORK' },
      rest: { accent: 'oklch(0.78 0.16 150)', bg: 'oklch(0.21 0.045 155)', label: 'REST' },
      done: { accent: 'oklch(0.85 0.02 150)', bg: 'oklch(0.18 0.01 150)', label: 'FERTIG' }
    };
    const ph = done ? P.done : P[step.phase];
    const next = steps[this.state.idx + 1];
    const segments = [];
    for (let r = 1; r <= c.rounds; r++) {
      let fill = 0;
      if (done || r < step.round) fill = 1;
      else if (r === step.round) fill = step.phase === 'rest' ? 1 : prog;
      segments.push({ fill: (fill * 100) + '%', color: done ? ph.accent : P.work.accent });
    }
    const running = this.state.running;
    return {
      bg: ph.bg, accent: ph.accent, phaseLabel: ph.label,
      timeText: this.fmt(remaining),
      subLabel: done ? 'Alle Sätze geschafft' : (step.phase === 'work' ? 'Gib alles' : 'Durchatmen'),
      dashOffset: (867.08 * (1 - prog)).toFixed(2),
      roundLabel: step.round + ' / ' + c.rounds, setLabel: step.set + ' / ' + c.sets,
      segments,
      nextText: done ? 'Workout beendet' : next ? 'Als Nächstes: ' + (next.phase === 'work' ? 'Work' : 'Rest') + ' · ' + this.fmt(next.dur) : 'Letzte Runde',
      nextColor: done || !next ? 'rgba(255,255,255,0.4)' : P[next.phase].accent,
      running, notRunning: !running,
      toggleLabel: done ? 'Neu starten' : running ? 'Pause' : (this.state.started ? 'Weiter' : 'Start'),
      toggle: () => {
        if (done) return this.setState({ idx: 0, remaining: null, running: true, started: true });
        this.setState({ running: !running, started: true });
      },
      reset: () => this.setState({ idx: 0, remaining: null, running: false, started: false }),
      skip: () => { if (!done) this.setState({ idx: this.state.idx + 1, remaining: null }); }
    };
  }
}
</script>
</body>
</html>
