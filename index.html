<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Boulder Log</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: system-ui, -apple-system, sans-serif;
      background: #111;
      color: #e0e0e0;
      min-height: 100dvh;
      padding: 1.25rem 1rem;
      max-width: 480px;
      margin: 0 auto;
    }

    h1 {
      font-size: 1.25rem;
      font-weight: 700;
      color: #fff;
      margin-bottom: 1.25rem;
      letter-spacing: -0.01em;
    }

    /* --- input area --- */
    .input-grid {
      display: grid;
      grid-template-columns: 1fr auto 2.75rem 2.75rem;
      gap: 0.5rem;
      align-items: stretch;
      margin-bottom: 0.5rem;
    }

    .input-grid input[type="text"] {
      background: #1e1e1e;
      border: 1px solid #2e2e2e;
      border-radius: 8px;
      color: #fff;
      font-size: 1rem;
      padding: 0 0.75rem;
      height: 44px;
      width: 100%;
      -webkit-appearance: none;
    }
    .input-grid input[type="text"]:focus {
      outline: none;
      border-color: #3a7bd5;
    }

    /* stepper */
    .stepper {
      display: flex;
      align-items: stretch;
      height: 44px;
      background: #1e1e1e;
      border: 1px solid #2e2e2e;
      border-radius: 8px;
      overflow: hidden;
    }
    .stepper button {
      background: none;
      border: none;
      color: #aaa;
      font-size: 1.2rem;
      width: 2rem;
      cursor: pointer;
      flex-shrink: 0;
    }
    .stepper button:active { background: #2e2e2e; }
    .stepper span {
      flex: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      color: #fff;
      font-size: 1rem;
      min-width: 1.75rem;
      user-select: none;
    }

    /* send toggle button */
    .btn-send {
      height: 44px;
      background: #1e1e1e;
      border: 1px solid #2e2e2e;
      border-radius: 8px;
      color: #666;
      font-size: 0.75rem;
      font-weight: 600;
      letter-spacing: 0.03em;
      cursor: pointer;
      padding: 0;
    }
    .btn-send.active {
      background: #1a3a1a;
      border-color: #2a5a2a;
      color: #6bcb77;
    }

    /* add button */
    .btn-add {
      background: #3a7bd5;
      border: none;
      border-radius: 8px;
      color: #fff;
      font-size: 1.4rem;
      font-weight: 700;
      height: 44px;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .btn-add:active { background: #2d63b0; }

    /* style row */
    .style-row {
      margin-bottom: 1.25rem;
    }
    .style-row input[type="text"] {
      background: #1e1e1e;
      border: 1px solid #2e2e2e;
      border-radius: 8px;
      color: #fff;
      font-size: 1rem;
      padding: 0 0.75rem;
      height: 44px;
      width: 100%;
      -webkit-appearance: none;
    }
    .style-row input[type="text"]:focus {
      outline: none;
      border-color: #3a7bd5;
    }
    .style-row input::placeholder { color: #555; }

    /* --- textarea --- */
    #log {
      width: 100%;
      min-height: 180px;
      background: #1a1a1a;
      border: 1px solid #2e2e2e;
      border-radius: 8px;
      color: #e0e0e0;
      font-family: monospace;
      font-size: 0.95rem;
      line-height: 1.6;
      padding: 0.75rem;
      resize: vertical;
      margin-bottom: 0.75rem;
    }
    #log:focus { outline: none; border-color: #3a7bd5; }

    /* --- action buttons --- */
    .actions {
      display: flex;
      gap: 0.5rem;
    }
    .btn-copy {
      flex: 1;
      background: #1e1e1e;
      border: 1px solid #2e2e2e;
      border-radius: 8px;
      color: #e0e0e0;
      font-size: 0.95rem;
      padding: 0.7rem 1rem;
      cursor: pointer;
    }
    .btn-copy:hover { background: #272727; }
    .btn-copy.copied {
      background: #1a2e1a;
      border-color: #2a4a2a;
      color: #6bcb77;
    }
    .btn-reset {
      background: #1e1a1a;
      border: 1px solid #3a2222;
      border-radius: 8px;
      color: #e05555;
      font-size: 0.95rem;
      padding: 0.7rem 1rem;
      cursor: pointer;
    }
    .btn-reset:hover { background: #2a1e1e; }

    input::placeholder { color: #555; }
  </style>
</head>
<body>

  <h1>Boulder Log</h1>

  <div class="input-grid">
    <input type="text" id="grade" list="grade-list" placeholder="Grad" autocomplete="off">
    <div class="stepper">
      <button type="button" onclick="changeTries(-1)">−</button>
      <span id="tries-val">1</span>
      <button type="button" onclick="changeTries(1)">+</button>
    </div>
    <button type="button" id="send-btn" class="btn-send" onclick="toggleSend()">send</button>
    <button class="btn-add" onclick="addEntry()" title="Hinzufügen">+</button>
  </div>

  <datalist id="grade-list">
    <option value="3"><option value="4"><option value="5"><option value="5+">
    <option value="6a"><option value="6a+"><option value="6b"><option value="6b+">
    <option value="6c"><option value="6c+"><option value="7a"><option value="7a+">
    <option value="7b"><option value="7b+"><option value="7c"><option value="7c+">
    <option value="8a"><option value="8a+"><option value="8b"><option value="8b+">
    <option value="8c"><option value="8c+">
  </datalist>

  <div class="style-row">
    <input type="text" id="style" placeholder="Stil (crimp, sloper, dyn …)" autocomplete="off">
  </div>

  <textarea id="log" placeholder="Noch keine Einträge …" spellcheck="false"></textarea>

  <div class="actions">
    <button class="btn-copy" id="copyBtn" onclick="copyLog()">Kopieren</button>
    <button class="btn-reset" onclick="resetLog()">Reset</button>
  </div>

  <script>
    const GRADES = ['3','4','5','5+','6a','6a+','6b','6b+','6c','6c+',
                    '7a','7a+','7b','7b+','7c','7c+','8a','8a+','8b','8b+','8c','8c+'];
    const GRADE_IDX = Object.fromEntries(GRADES.map((g, i) => [g, i]));
    const KEY = 'boulder_log';

    const logEl    = document.getElementById('log');
    const gradeEl  = document.getElementById('grade');
    const triesVal = document.getElementById('tries-val');
    const sendBtn  = document.getElementById('send-btn');
    const styleEl  = document.getElementById('style');

    let tries = 1;

    function changeTries(delta) {
      tries = Math.max(1, tries + delta);
      triesVal.textContent = tries;
    }

    function toggleSend() {
      sendBtn.classList.toggle('active');
    }

    // select-all on focus prevents fiddly deletion
    [gradeEl, styleEl].forEach(el =>
      el.addEventListener('focus', () => el.select())
    );

    // restore from session
    logEl.value = sessionStorage.getItem(KEY) || '';

    logEl.addEventListener('input', () => {
      sessionStorage.setItem(KEY, logEl.value);
    });

    function gradeRank(grade) {
      const g = grade.trim().toLowerCase();
      const idx = GRADES.findIndex(x => x.toLowerCase() === g);
      return idx === -1 ? 999 : idx;
    }

    function buildLine(grade, tries, send, style) {
      const tryWord = tries === 1 ? 'try' : 'tries';
      const sendPart = send ? ' (send)' : '';
      const stylePart = style ? ` - ${style}` : '';
      return `- ${grade}: ${tries} ${tryWord}${sendPart}${stylePart}`;
    }

    function addEntry() {
      const grade = gradeEl.value.trim();
      if (!grade) { gradeEl.focus(); return; }

      const triesCount = tries;
      const send  = sendBtn.classList.contains('active');
      const style = styleEl.value.trim();
      const newLine = buildLine(grade, triesCount, send, style);
      const newRank = gradeRank(grade);

      const current = logEl.value;
      const lines = current ? current.split('\n') : [];

      // find insertion index: after last line with rank <= newRank
      let insertAt = lines.length;
      for (let i = 0; i < lines.length; i++) {
        const m = lines[i].match(/^- ([^:]+):/);
        if (m && gradeRank(m[1]) > newRank) {
          insertAt = i;
          break;
        }
      }

      lines.splice(insertAt, 0, newLine);
      logEl.value = lines.join('\n');
      sessionStorage.setItem(KEY, logEl.value);

      // reset inputs
      tries = 1; triesVal.textContent = 1;
      sendBtn.classList.remove('active');
      styleEl.value  = '';
      gradeEl.focus();
    }

    function copyLog() {
      const text = logEl.value.trim();
      if (!text) return;
      navigator.clipboard.writeText(text).then(() => {
        const btn = document.getElementById('copyBtn');
        btn.textContent = 'Kopiert ✓';
        btn.classList.add('copied');
        setTimeout(() => {
          btn.textContent = 'Kopieren';
          btn.classList.remove('copied');
        }, 2000);
      });
    }

    function resetLog() {
      if (!logEl.value.trim()) return;
      if (confirm('Alle Einträge löschen?')) {
        logEl.value = '';
        sessionStorage.removeItem(KEY);
      }
    }

    // Enter on grade or style triggers add
    gradeEl.addEventListener('keydown', e => { if (e.key === 'Enter') addEntry(); });
    styleEl.addEventListener('keydown', e => { if (e.key === 'Enter') addEntry(); });
  </script>

</body>
</html>
