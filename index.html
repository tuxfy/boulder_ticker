<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Bouldering Berlin</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: system-ui, -apple-system, sans-serif;
      background: #111;
      color: #e0e0e0;
      min-height: 100dvh;
    }

    [hidden] { display: none !important; }

    /* ── HOME ── */
    #screen-home {
      padding: 2rem 1.25rem 1.25rem;
      max-width: 480px;
      margin: 0 auto;
    }

    .home-title {
      font-size: 1.5rem;
      font-weight: 800;
      color: #fff;
      letter-spacing: -0.02em;
      margin-bottom: 0.2rem;
    }

    .home-section {
      font-size: 0.75rem;
      font-weight: 600;
      color: #555;
      text-transform: uppercase;
      letter-spacing: 0.1em;
      margin-bottom: 1.75rem;
    }

    .tool-grid {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 1rem;
    }

    .tile {
      aspect-ratio: 1;
      background: #1e1e1e;
      border: 1px solid #2a2a2a;
      border-radius: 18px;
      cursor: pointer;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 0.6rem;
      padding: 1rem;
      -webkit-tap-highlight-color: transparent;
      transition: transform 0.1s, background 0.1s;
    }
    .tile:active {
      background: #272727;
      transform: scale(0.95);
    }

    .tile-icon { display: flex; }

    .tile-label {
      font-size: 0.85rem;
      font-weight: 600;
      color: #e0e0e0;
      text-align: center;
    }

    /* ── TOOL SHELL ── */
    .tool-screen {
      display: flex;
      flex-direction: column;
      min-height: 100dvh;
    }

    .tool-header {
      position: sticky;
      top: 0;
      z-index: 10;
      background: #111;
      border-bottom: 1px solid #1e1e1e;
      display: grid;
      grid-template-columns: 1fr auto 1fr;
      align-items: center;
      padding: 0.625rem 1rem;
    }

    .tool-header h1 {
      justify-self: start;
      font-size: 1rem;
      font-weight: 700;
      color: #fff;
    }

    .btn-tools {
      background: #1e1e1e;
      border: 1px solid #2a2a2a;
      border-radius: 10px;
      color: #ccc;
      font-size: 0.9rem;
      font-weight: 600;
      padding: 0.45rem 0.875rem;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 0.35rem;
      white-space: nowrap;
      min-height: 40px;
      -webkit-tap-highlight-color: transparent;
    }
    .btn-tools:active { background: #272727; }

    .tool-content {
      padding: 1.25rem 1rem;
      max-width: 480px;
      margin: 0 auto;
      width: 100%;
      flex: 1;
      display: flex;
      flex-direction: column;
    }

    /* ── BOULDER LOG ── */
    .input-grid {
      display: grid;
      grid-template-columns: 1fr auto 2.75rem 2.75rem;
      gap: 0.5rem;
      align-items: stretch;
      margin-bottom: 0.5rem;
    }

    .input-grid input[type="text"] {
      background: #1e1e1e;
      border: 1px solid #2a2a2a;
      border-radius: 8px;
      color: #fff;
      font-size: 1rem;
      padding: 0 0.75rem;
      height: 44px;
      width: 100%;
      -webkit-appearance: none;
    }
    .input-grid input[type="text"]:focus {
      outline: none;
      border-color: #3a7bd5;
    }

    .stepper {
      display: flex;
      align-items: stretch;
      height: 44px;
      background: #1e1e1e;
      border: 1px solid #2a2a2a;
      border-radius: 8px;
      overflow: hidden;
    }
    .stepper button {
      background: none;
      border: none;
      color: #aaa;
      font-size: 1.2rem;
      width: 2.25rem;
      cursor: pointer;
      flex-shrink: 0;
      -webkit-tap-highlight-color: transparent;
    }
    .stepper button:active { background: #2a2a2a; }
    .stepper span {
      flex: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      color: #fff;
      font-size: 1rem;
      min-width: 1.75rem;
      user-select: none;
    }

    .btn-send {
      height: 44px;
      background: #1e1e1e;
      border: 1px solid #2a2a2a;
      border-radius: 8px;
      color: #666;
      font-size: 0.75rem;
      font-weight: 600;
      letter-spacing: 0.03em;
      cursor: pointer;
      padding: 0;
    }
    .btn-send.active {
      background: #1a3a1a;
      border-color: #2a5a2a;
      color: #6bcb77;
    }

    .btn-add {
      background: #3a7bd5;
      border: none;
      border-radius: 8px;
      color: #fff;
      font-size: 1.4rem;
      font-weight: 700;
      height: 44px;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .btn-add:active { background: #2d63b0; }

    .style-row { margin-bottom: 1.25rem; }
    .style-row input[type="text"] {
      background: #1e1e1e;
      border: 1px solid #2a2a2a;
      border-radius: 8px;
      color: #fff;
      font-size: 1rem;
      padding: 0 0.75rem;
      height: 44px;
      width: 100%;
      -webkit-appearance: none;
    }
    .style-row input[type="text"]:focus {
      outline: none;
      border-color: #3a7bd5;
    }

    #log {
      width: 100%;
      min-height: 180px;
      background: #1a1a1a;
      border: 1px solid #2a2a2a;
      border-radius: 8px;
      color: #e0e0e0;
      font-family: monospace;
      font-size: 0.95rem;
      line-height: 1.6;
      padding: 0.75rem;
      resize: vertical;
      margin-bottom: 0.75rem;
    }
    #log:focus { outline: none; border-color: #3a7bd5; }

    .actions { display: flex; gap: 0.5rem; }
    .btn-copy {
      flex: 1;
      background: #1e1e1e;
      border: 1px solid #2a2a2a;
      border-radius: 8px;
      color: #e0e0e0;
      font-size: 0.95rem;
      padding: 0.7rem 1rem;
      cursor: pointer;
    }
    .btn-copy:active { background: #272727; }
    .btn-copy.copied {
      background: #1a2e1a;
      border-color: #2a4a2a;
      color: #6bcb77;
    }
    .btn-reset {
      background: #1e1a1a;
      border: 1px solid #3a2222;
      border-radius: 8px;
      color: #e05555;
      font-size: 0.95rem;
      padding: 0.7rem 1rem;
      cursor: pointer;
    }
    .btn-reset:active { background: #2a1e1e; }

    input::placeholder, textarea::placeholder { color: #555; }

    /* ── TIMER ── */
    .timer-params {
      display: flex;
      flex-direction: column;
      margin-bottom: 1.5rem;
    }
    .timer-param {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0.75rem 0;
      border-bottom: 1px solid #1e1e1e;
    }
    .timer-params .timer-param:first-child { border-top: 1px solid #1e1e1e; }
    .timer-param-label { font-size: 0.95rem; color: #ccc; }
    .timer-param-right {
      display: flex;
      align-items: center;
      gap: 0.5rem;
    }
    .timer-stepper input {
      flex: 1;
      background: none;
      border: none;
      color: #fff;
      font-size: 1rem;
      text-align: center;
      min-width: 3rem;
      width: 3rem;
      padding: 0;
      -webkit-appearance: none;
      appearance: none;
    }
    .timer-stepper input:focus { outline: none; color: #fff; }
    .timer-param-unit { font-size: 0.85rem; color: #555; width: 0.75rem; }

    .btn-timer-start {
      width: 100%;
      background: #fff;
      border: none;
      border-radius: 12px;
      color: #111;
      font-size: 1.1rem;
      font-weight: 700;
      padding: 1rem;
      cursor: pointer;
      -webkit-tap-highlight-color: transparent;
    }
    .btn-timer-start:active { background: #ddd; }

    /* timer active display */
    #timer-display {
      flex: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: space-between;
      padding: 2.5rem 0 1rem;
      text-align: center;
    }

    .timer-phase-label {
      font-size: 1rem;
      font-weight: 700;
      letter-spacing: 0.25em;
      text-transform: uppercase;
      color: #555;
      transition: color 0.3s;
    }
    .timer-phase-label.work  { color: #e05555; }
    .timer-phase-label.rest  { color: #6bcb77; }

    .timer-time {
      font-size: 6rem;
      font-weight: 800;
      letter-spacing: -0.03em;
      color: #fff;
      line-height: 1;
      font-variant-numeric: tabular-nums;
    }
    @keyframes timerpulse {
      0%   { transform: scale(1); }
      40%  { transform: scale(1.07); }
      100% { transform: scale(1); }
    }
    .timer-time.pulse { animation: timerpulse 0.22s ease-out; }

    .timer-progress {
      font-size: 0.9rem;
      color: #555;
      letter-spacing: 0.03em;
      min-height: 1.2em;
    }

    .timer-controls {
      display: flex;
      gap: 0.75rem;
      width: 100%;
    }
    .btn-timer-pause {
      flex: 1;
      background: #1e1e1e;
      border: 1px solid #2a2a2a;
      border-radius: 12px;
      color: #e0e0e0;
      font-size: 1rem;
      font-weight: 600;
      padding: 0.875rem;
      cursor: pointer;
      -webkit-tap-highlight-color: transparent;
    }
    .btn-timer-pause:active { background: #272727; }
    .btn-timer-abort {
      background: #1e1a1a;
      border: 1px solid #3a2222;
      border-radius: 12px;
      color: #e05555;
      font-size: 1rem;
      font-weight: 600;
      padding: 0.875rem 1.25rem;
      cursor: pointer;
      -webkit-tap-highlight-color: transparent;
    }
    .btn-timer-abort:active { background: #2a1e1e; }

    /* phase background on content area */
    #timer-content { transition: background 0.4s ease; }
    #timer-content.phase-work     { background: #2d0f0f; }
    #timer-content.phase-rest     { background: #0f2d1a; }
    #timer-content.phase-set-pause { background: #0f2d1a; }

    /* ── GYM BAR ── */
    .gym-bar {
      padding: 0.4rem 1rem;
      border-bottom: 1px solid #1e1e1e;
      background: #111;
      display: flex; justify-content: center;
    }
    .gym-bar-link {
      background: none; border: none; padding: 0;
      cursor: pointer; display: inline-flex; align-items: baseline;
      gap: 0.35rem; font-size: 0.82rem; line-height: 1.4;
      -webkit-tap-highlight-color: transparent; text-align: center;
    }
    .gym-bar-link:active { opacity: 0.7; }
    .gym-name     { color: #e0e0e0; font-weight: 600; }
    .gym-location { color: #666; }
    .gym-bar-link .gym-none { color: #555; text-decoration: underline; text-underline-offset: 2px; }

    /* ── SCANNER TRIGGER ── */
    .scanner-trigger {
      display: flex; flex-direction: column; align-items: center;
      padding: 0.75rem 0 0.25rem;
    }
    .btn-scan-qr {
      background: none; border: none; cursor: pointer; color: #444;
      display: flex; flex-direction: column; align-items: center; gap: 0.3rem;
      -webkit-tap-highlight-color: transparent; transition: color 0.15s;
    }
    .btn-scan-qr:active { color: #888; }
    .btn-scan-qr span { font-size: 0.72rem; letter-spacing: 0.06em; text-transform: uppercase; }
    .scan-status-msg {
      font-size: 0.82rem; color: transparent; text-align: center;
      min-height: 1.1em; margin: 0.5rem 1rem 0.75rem; padding: 0;
      transition: color 0.15s;
    }
    .scan-status-msg:not(:empty) {
      color: #f87171;
      border: 1px solid #7f1d1d;
      border-radius: 6px;
      background: #1f0606;
      padding: 0.45rem 0.75rem;
    }

    /* ── SCANNER OVERLAY ── */
    #scanner-overlay {
      position: fixed; inset: 0; z-index: 100;
      background: #000; display: flex; flex-direction: column;
      align-items: center; justify-content: center;
    }
    #scanner-video {
      width: 100%; max-width: 480px; border-radius: 12px;
    }
    .scanner-overlay-hint {
      color: #666; font-size: 0.85rem; margin-top: 0.75rem;
      text-align: center; padding: 0 1rem;
    }
    .btn-scan-abort {
      position: absolute; bottom: 2.5rem;
      left: 50%; transform: translateX(-50%);
      background: #1e1e1e; border: 1px solid #2a2a2a; border-radius: 12px;
      color: #e0e0e0; font-size: 1rem; font-weight: 600;
      padding: 0.875rem 2.5rem; cursor: pointer; white-space: nowrap;
      -webkit-tap-highlight-color: transparent;
    }
    .btn-scan-abort:active { background: #272727; }

    /* ── GYM SCREEN ── */
    .gym-search-row { display: flex; gap: 0.5rem; margin-bottom: 0.5rem; }
    .gym-search-row input {
      flex: 1; background: #1e1e1e; border: 1px solid #2a2a2a;
      border-radius: 8px; color: #fff; font-size: 1rem;
      padding: 0 0.75rem; height: 44px; -webkit-appearance: none;
    }
    .gym-search-row input:focus { outline: none; border-color: #3a7bd5; }
    .btn-gym-refresh {
      height: 44px; background: #1e1e1e; border: 1px solid #2a2a2a;
      border-radius: 8px; color: #aaa; font-size: 0.85rem; font-weight: 600;
      padding: 0 0.875rem; cursor: pointer; white-space: nowrap;
      -webkit-tap-highlight-color: transparent;
    }
    .btn-gym-refresh:active { background: #272727; }
    .btn-gym-refresh:disabled { opacity: 0.4; }
    .gym-status-line { color: #666; font-size: 0.85rem; padding: 0.5rem 0; min-height: 1.4em; }
    .gym-list { list-style: none; }
    .gym-item {
      padding: 0.7rem 0; border-bottom: 1px solid #1e1e1e;
      cursor: pointer; -webkit-tap-highlight-color: transparent;
    }
    .gym-item:active { opacity: 0.7; }
    .gym-item-name { font-size: 0.95rem; color: #e0e0e0; font-weight: 600; }
    .gym-item-name.is-selected { color: #3a7bd5; }
    .gym-item-addr { font-size: 0.78rem; color: #666; margin-top: 0.1rem; }
    .gym-no-results { color: #555; font-size: 0.9rem; padding: 1rem 0; }
  </style>
</head>
<body>

  <!-- HOME -->
  <div id="screen-home">
    <h1 class="home-title">Bouldering Berlin</h1>
    <p class="home-section">Tools</p>
    <div class="tool-grid">

      <button class="tile" onclick="navigate('boulderlog')">
        <svg width="52" height="52" viewBox="0 0 52 52" fill="none" aria-hidden="true">
          <rect x="5" y="3" width="30" height="38" rx="5" fill="white" fill-opacity="0.12"/>
          <line x1="11" y1="13" x2="29" y2="13" stroke="white" stroke-width="2.5" stroke-linecap="round" stroke-opacity="0.7"/>
          <line x1="11" y1="20" x2="29" y2="20" stroke="white" stroke-width="2.5" stroke-linecap="round" stroke-opacity="0.7"/>
          <line x1="11" y1="27" x2="20" y2="27" stroke="white" stroke-width="2.5" stroke-linecap="round" stroke-opacity="0.7"/>
          <circle cx="37" cy="39" r="12" fill="white"/>
          <path d="M31 39 l5 5 l9-9" stroke="#1e1e1e" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
        </svg>
        <span class="tile-label">Boulder Log</span>
      </button>

      <button class="tile" onclick="navigate('timer')">
        <svg width="52" height="52" viewBox="0 0 52 52" fill="none" aria-hidden="true">
          <circle cx="26" cy="30" r="17" fill="white" fill-opacity="0.12" stroke="white" stroke-opacity="0.75" stroke-width="2.5"/>
          <rect x="21" y="9" width="10" height="5" rx="2.5" fill="white" fill-opacity="0.65"/>
          <line x1="17" y1="14" x2="14" y2="11" stroke="white" stroke-opacity="0.45" stroke-width="2" stroke-linecap="round"/>
          <line x1="26" y1="30" x2="26" y2="19" stroke="white" stroke-width="2.5" stroke-linecap="round"/>
          <line x1="26" y1="30" x2="35" y2="30" stroke="white" stroke-width="2.5" stroke-linecap="round"/>
          <circle cx="26" cy="30" r="2.5" fill="white"/>
        </svg>
        <span class="tile-label">Timer</span>
      </button>

    </div>
  </div>

  <!-- BOULDER LOG -->
  <div id="screen-boulderlog" class="tool-screen" hidden>
    <header class="tool-header">
      <h1>Boulder Log</h1>
      <button class="btn-tools" onclick="navigate('')">⊞ Tools</button>
    </header>
    <div class="gym-bar">
      <button class="gym-bar-link" onclick="navigate('gym')" id="gym-bar-btn">
        <span id="gym-bar-text" class="gym-none">Keine Halle gewählt</span>
      </button>
    </div>
    <div class="tool-content">

      <div class="scanner-trigger">
        <button class="btn-scan-qr" onclick="scanStart()" aria-label="QR-Code scannen">
          <svg width="44" height="44" viewBox="0 0 44 44" fill="none" aria-hidden="true">
            <rect x="3" y="3" width="14" height="14" rx="2" stroke="#444" stroke-width="2" fill="none"/>
            <rect x="7" y="7" width="6" height="6" fill="#444"/>
            <rect x="27" y="3" width="14" height="14" rx="2" stroke="#444" stroke-width="2" fill="none"/>
            <rect x="31" y="7" width="6" height="6" fill="#444"/>
            <rect x="3" y="27" width="14" height="14" rx="2" stroke="#444" stroke-width="2" fill="none"/>
            <rect x="7" y="31" width="6" height="6" fill="#444"/>
            <rect x="27" y="27" width="4" height="4" fill="#444"/>
            <rect x="33" y="27" width="4" height="4" fill="#444"/>
            <rect x="27" y="33" width="4" height="4" fill="#444"/>
            <rect x="33" y="33" width="4" height="4" fill="#444"/>
            <rect x="30" y="30" width="4" height="4" fill="#444"/>
          </svg>
          <span>Scan QR</span>
        </button>
      </div>
      <p id="scan-status" class="scan-status-msg"></p>

      <div class="input-grid">
        <input type="text" id="grade" list="grade-list" placeholder="Grad" autocomplete="off">
        <div class="stepper">
          <button type="button" onclick="changeTries(-1)">−</button>
          <span id="tries-val">1</span>
          <button type="button" onclick="changeTries(1)">+</button>
        </div>
        <button type="button" id="send-btn" class="btn-send" onclick="toggleSend()">send</button>
        <button class="btn-add" onclick="addEntry()">+</button>
      </div>

      <datalist id="grade-list">
        <option value="3"><option value="4"><option value="5"><option value="5+">
        <option value="6a"><option value="6a+"><option value="6b"><option value="6b+">
        <option value="6c"><option value="6c+"><option value="7a"><option value="7a+">
        <option value="7b"><option value="7b+"><option value="7c"><option value="7c+">
        <option value="8a"><option value="8a+"><option value="8b"><option value="8b+">
        <option value="8c"><option value="8c+">
      </datalist>

      <div class="style-row">
        <input type="text" id="style" placeholder="Stil (crimp, sloper, dyn …)" autocomplete="off">
      </div>

      <textarea id="log" placeholder="Noch keine Einträge …" spellcheck="false"></textarea>

      <div class="actions">
        <button class="btn-copy" id="copyBtn" onclick="copyLog()">Kopieren</button>
        <button class="btn-reset" onclick="resetLog()">Reset</button>
      </div>

    </div>
  </div>

  <!-- TIMER -->
  <div id="screen-timer" class="tool-screen" hidden>
    <header class="tool-header">
      <h1>Timer</h1>
      <button class="btn-tools" onclick="navigate('')">⊞ Tools</button>
    </header>
    <div class="tool-content" id="timer-content">

      <!-- CONFIG -->
      <div id="timer-config">
        <div class="timer-params">
          <div class="timer-param">
            <span class="timer-param-label">Work</span>
            <div class="timer-param-right">
              <div class="stepper timer-stepper">
                <button type="button" onclick="adjustParam('work',-1)">−</button>
                <input type="text" inputmode="numeric" pattern="[0-9]*" id="val-work" value="45"
                       oninput="onParamInput('work')" onblur="clampParam('work')">
                <button type="button" onclick="adjustParam('work',1)">+</button>
              </div>
              <span class="timer-param-unit">s</span>
            </div>
          </div>
          <div class="timer-param">
            <span class="timer-param-label">Rest</span>
            <div class="timer-param-right">
              <div class="stepper timer-stepper">
                <button type="button" onclick="adjustParam('rest',-1)">−</button>
                <input type="text" inputmode="numeric" pattern="[0-9]*" id="val-rest" value="90"
                       oninput="onParamInput('rest')" onblur="clampParam('rest')">
                <button type="button" onclick="adjustParam('rest',1)">+</button>
              </div>
              <span class="timer-param-unit">s</span>
            </div>
          </div>
          <div class="timer-param">
            <span class="timer-param-label">Anzahl Work</span>
            <div class="timer-param-right">
              <div class="stepper timer-stepper">
                <button type="button" onclick="adjustParam('numWork',-1)">−</button>
                <input type="text" inputmode="numeric" pattern="[0-9]*" id="val-numWork" value="5"
                       oninput="onParamInput('numWork')" onblur="clampParam('numWork')">
                <button type="button" onclick="adjustParam('numWork',1)">+</button>
              </div>
              <span class="timer-param-unit"></span>
            </div>
          </div>
          <div class="timer-param">
            <span class="timer-param-label">Anzahl Sets</span>
            <div class="timer-param-right">
              <div class="stepper timer-stepper">
                <button type="button" onclick="adjustParam('numSets',-1)">−</button>
                <input type="text" inputmode="numeric" pattern="[0-9]*" id="val-numSets" value="2"
                       oninput="onParamInput('numSets')" onblur="clampParam('numSets')">
                <button type="button" onclick="adjustParam('numSets',1)">+</button>
              </div>
              <span class="timer-param-unit"></span>
            </div>
          </div>
          <div class="timer-param">
            <span class="timer-param-label">Set-Pause</span>
            <div class="timer-param-right">
              <div class="stepper timer-stepper">
                <button type="button" onclick="adjustParam('setPause',-1)">−</button>
                <input type="text" inputmode="numeric" pattern="[0-9]*" id="val-setPause" value="180"
                       oninput="onParamInput('setPause')" onblur="clampParam('setPause')">
                <button type="button" onclick="adjustParam('setPause',1)">+</button>
              </div>
              <span class="timer-param-unit">s</span>
            </div>
          </div>
        </div>
        <button class="btn-timer-start" onclick="timerStart()">Start</button>
      </div>

      <!-- DISPLAY -->
      <div id="timer-display" hidden>
        <div class="timer-phase-label" id="timer-phase">VORBEREITUNG</div>
        <div class="timer-time" id="timer-time">0:10</div>
        <div class="timer-progress" id="timer-progress"></div>
        <div class="timer-controls">
          <button class="btn-timer-pause" id="btn-pause" onclick="timerTogglePause()">Pause</button>
          <button class="btn-timer-abort" onclick="timerReset()">Reset</button>
        </div>
      </div>

    </div>
  </div>

  <!-- GYM SELECTION -->
  <div id="screen-gym" class="tool-screen" hidden>
    <header class="tool-header">
      <h1>Halle wählen</h1>
      <button class="btn-tools" onclick="navigate('boulderlog')">← Zurück</button>
    </header>
    <div class="tool-content">
      <div class="gym-search-row">
        <input type="text" id="gym-search" placeholder="Halle suchen …" autocomplete="off" oninput="gymRenderList()">
        <button class="btn-gym-refresh" id="btn-gym-refresh" onclick="gymRefresh()">Aktualisieren</button>
      </div>
      <p class="gym-status-line" id="gym-status"></p>
      <ul class="gym-list" id="gym-list"></ul>
    </div>
  </div>

  <!-- SCANNER OVERLAY -->
  <div id="scanner-overlay" hidden>
    <video id="scanner-video" autoplay muted playsinline></video>
    <p class="scanner-overlay-hint">QR-Code in die Kamera halten …</p>
    <button class="btn-scan-abort" onclick="scanAbort()">Abbrechen</button>
  </div>

  <script>
    // ── ROUTING ──────────────────────────────────────────────────
    const SCREENS = {
      '':           'screen-home',
      'boulderlog': 'screen-boulderlog',
      'timer':      'screen-timer',
      'gym':        'screen-gym',
    };

    function navigate(tool) {
      location.hash = tool ? `/${tool}` : '/';
    }

    function render() {
      const tool = location.hash.replace(/^#\/?/, '');
      const active = SCREENS[tool] ?? 'screen-home';
      Object.values(SCREENS).forEach(id => {
        document.getElementById(id).hidden = id !== active;
      });
      if (active === 'screen-boulderlog') gymUpdateBar();
      if (active === 'screen-gym')        onGymScreenOpen();
    }

    window.addEventListener('hashchange', render);
    window.addEventListener('load', render);

    // ── BOULDER LOG ───────────────────────────────────────────────
    const KEY      = 'boulder_log';
    const logEl    = document.getElementById('log');
    const gradeEl  = document.getElementById('grade');
    const triesVal = document.getElementById('tries-val');
    const sendBtn  = document.getElementById('send-btn');
    const styleEl  = document.getElementById('style');

    let tries = 1;

    function changeTries(delta) {
      tries = Math.max(1, tries + delta);
      triesVal.textContent = tries;
    }

    function toggleSend() { sendBtn.classList.toggle('active'); }

    [gradeEl, styleEl].forEach(el => el.addEventListener('focus', () => el.select()));

    logEl.value = sessionStorage.getItem(KEY) || '';
    logEl.addEventListener('input', () => sessionStorage.setItem(KEY, logEl.value));

    function buildLine(grade, t, send, style) {
      return `- ${grade}: ${t} ${t === 1 ? 'try' : 'tries'}${send ? ' (send)' : ''}${style ? ` - ${style}` : ''}`;
    }

    function addEntry() {
      const grade = gradeEl.value.trim();
      if (!grade) { gradeEl.focus(); return; }
      const line = buildLine(grade, tries, sendBtn.classList.contains('active'), styleEl.value.trim());
      logEl.value = logEl.value ? logEl.value + '\n' + line : line;
      sessionStorage.setItem(KEY, logEl.value);
      tries = 1; triesVal.textContent = 1;
      sendBtn.classList.remove('active');
      styleEl.value = '';
      gradeEl.focus();
    }

    function copyLog() {
      const text = logEl.value.trim();
      if (!text) return;
      navigator.clipboard.writeText(text).then(() => {
        const btn = document.getElementById('copyBtn');
        btn.textContent = 'Kopiert ✓';
        btn.classList.add('copied');
        setTimeout(() => { btn.textContent = 'Kopieren'; btn.classList.remove('copied'); }, 2000);
      });
    }

    function resetLog() {
      if (!logEl.value.trim()) return;
      if (confirm('Alle Einträge löschen?')) {
        logEl.value = '';
        sessionStorage.removeItem(KEY);
      }
    }

    gradeEl.addEventListener('keydown', e => { if (e.key === 'Enter') addEntry(); });
    styleEl.addEventListener('keydown', e => { if (e.key === 'Enter') addEntry(); });

    // ── TIMER ─────────────────────────────────────────────────────
    const TIMER_KEY = 'timer_cfg';
    const PREP_SECS = 10;

    const PARAM_META = {
      work:     { min: 1,  max: 600 },
      rest:     { min: 1,  max: 600 },
      numWork:  { min: 1,  max: 30  },
      numSets:  { min: 1,  max: 20  },
      setPause: { min: 1,  max: 600 },
    };

    let cfg = { work: 45, rest: 90, numWork: 5, numSets: 2, setPause: 180 };

    (function loadTimerCfg() {
      try {
        const saved = JSON.parse(localStorage.getItem(TIMER_KEY));
        if (saved) {
          Object.keys(cfg).forEach(k => { if (saved[k] != null) cfg[k] = saved[k]; });
          Object.keys(cfg).forEach(k => {
            document.getElementById(`val-${k}`).value = cfg[k];
          });
        }
      } catch (_) {}
    })();

    function saveTimerCfg() {
      localStorage.setItem(TIMER_KEY, JSON.stringify(cfg));
    }

    function adjustParam(key, delta) {
      const { min, max } = PARAM_META[key];
      const input = document.getElementById(`val-${key}`);
      const current = parseInt(input.value);
      cfg[key] = Math.min(max, Math.max(min, (isNaN(current) ? cfg[key] : current) + delta));
      input.value = cfg[key];
      saveTimerCfg();
    }

    function onParamInput(key) {
      const { min, max } = PARAM_META[key];
      const val = parseInt(document.getElementById(`val-${key}`).value);
      if (!isNaN(val)) { cfg[key] = Math.min(max, Math.max(min, val)); saveTimerCfg(); }
    }

    function clampParam(key) {
      const { min, max } = PARAM_META[key];
      const input = document.getElementById(`val-${key}`);
      const val = parseInt(input.value);
      cfg[key] = Math.min(max, Math.max(min, isNaN(val) ? cfg[key] : val));
      input.value = cfg[key];
      saveTimerCfg();
    }

    // timer state
    let tState = null;
    let tInterval = null;

    function timerStart() {
      if (tInterval) return;
      saveTimerCfg();
      unlockAudio(); // iOS: stiller Buffer entsperrt den Audio-Stack im User-Gesture
      tState = { phase: 'prep', timeLeft: PREP_SECS, workIdx: 1, setIdx: 1, paused: false };
      document.getElementById('timer-config').hidden = true;
      document.getElementById('timer-display').hidden = false;
      updateTimerDisplay();
      requestWakeLock();
      tInterval = setInterval(timerTick, 1000);
    }

    function timerTick() {
      if (tState.paused) return;
      tState.timeLeft--;

      if (tState.timeLeft <= 0) {
        playBeep(440, 0.35);
        advancePhase();
      } else {
        if (tState.timeLeft <= 3) playBeep(880, 0.08);
        if (tState.timeLeft <= 3) pulseTime();
        updateTimerDisplay();
      }
    }

    function advancePhase() {
      const { phase, workIdx, setIdx } = tState;

      if (phase === 'prep') {
        tState.phase = 'work';
        tState.timeLeft = cfg.work;

      } else if (phase === 'work') {
        const lastWork = workIdx >= cfg.numWork;
        const lastSet  = setIdx  >= cfg.numSets;

        if (lastWork && lastSet) {
          tState.phase = 'done';
          clearInterval(tInterval);
          releaseWakeLock();
          playFinish();
          updateTimerDisplay();
          setTimeout(() => { if (tState?.phase === 'done') timerReset(); }, 2500);
          return;
        } else if (lastWork) {
          tState.phase = 'set-pause';
          tState.timeLeft = cfg.setPause;
        } else {
          tState.phase = 'rest';
          tState.timeLeft = cfg.rest;
        }

      } else if (phase === 'rest') {
        tState.workIdx++;
        tState.phase = 'work';
        tState.timeLeft = cfg.work;

      } else if (phase === 'set-pause') {
        tState.setIdx++;
        tState.workIdx = 1;
        tState.phase = 'work';
        tState.timeLeft = cfg.work;
      }

      updateTimerDisplay();
    }

    function updateTimerDisplay() {
      const { phase, timeLeft, workIdx, setIdx } = tState;
      const phaseEl    = document.getElementById('timer-phase');
      const timeEl     = document.getElementById('timer-time');
      const progressEl = document.getElementById('timer-progress');
      const content    = document.getElementById('timer-content');

      const labels = {
        prep:       'Vorbereitung',
        work:       'Work',
        rest:       'Rest',
        'set-pause':'Set-Pause',
        done:       'Fertig',
      };
      phaseEl.textContent = labels[phase] ?? phase;
      phaseEl.className = 'timer-phase-label';
      if (phase === 'work') phaseEl.classList.add('work');
      if (phase === 'rest' || phase === 'set-pause') phaseEl.classList.add('rest');

      timeEl.textContent = phase === 'done' ? '—' : formatTime(timeLeft);

      content.className = 'tool-content';
      if (phase === 'work')      content.classList.add('phase-work');
      if (phase === 'rest')      content.classList.add('phase-rest');
      if (phase === 'set-pause') content.classList.add('phase-set-pause');

      if (phase === 'work' || phase === 'rest') {
        progressEl.textContent = `Work ${workIdx} / ${cfg.numWork} · Set ${setIdx} / ${cfg.numSets}`;
      } else if (phase === 'set-pause') {
        progressEl.textContent = `Set ${setIdx} / ${cfg.numSets} abgeschlossen`;
      } else {
        progressEl.textContent = '';
      }

      const pauseBtn = document.getElementById('btn-pause');
      if (phase === 'done') {
        pauseBtn.hidden = true;
      } else {
        pauseBtn.hidden = false;
        pauseBtn.textContent = tState.paused ? 'Weiter' : 'Pause';
      }
    }

    function timerTogglePause() {
      tState.paused = !tState.paused;
      document.getElementById('btn-pause').textContent = tState.paused ? 'Weiter' : 'Pause';
      if (tState.paused) releaseWakeLock();
      else requestWakeLock();
    }

    function timerReset() {
      clearInterval(tInterval);
      tInterval = null;
      tState = null;
      releaseWakeLock();
      document.getElementById('timer-display').hidden = true;
      document.getElementById('timer-config').hidden = false;
      document.getElementById('timer-content').className = 'tool-content';
    }

    function formatTime(secs) {
      const m = Math.floor(secs / 60);
      const s = secs % 60;
      return `${m}:${s.toString().padStart(2, '0')}`;
    }

    function pulseTime() {
      const el = document.getElementById('timer-time');
      el.classList.remove('pulse');
      void el.offsetWidth;
      el.classList.add('pulse');
    }

    // ── AUDIO ─────────────────────────────────────────────────────
    let audioCtx = null;

    function getAudioCtx() {
      if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
      if (audioCtx.state === 'suspended') audioCtx.resume();
      return audioCtx;
    }

    function unlockAudio() {
      try {
        const ctx = getAudioCtx();
        const buf = ctx.createBuffer(1, 1, 22050);
        const src = ctx.createBufferSource();
        src.buffer = buf;
        src.connect(ctx.destination);
        src.start(0);
      } catch (_) {}
    }

    function playBeep(freq, dur) {
      try {
        const ctx  = getAudioCtx();
        const osc  = ctx.createOscillator();
        const gain = ctx.createGain();
        osc.connect(gain);
        gain.connect(ctx.destination);
        osc.frequency.value = freq;
        osc.type = 'sine';
        gain.gain.setValueAtTime(0.25, ctx.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + dur);
        osc.start(ctx.currentTime);
        osc.stop(ctx.currentTime + dur);
      } catch (_) {}
    }

    function playFinish() {
      [0, 0.18, 0.36].forEach(t => {
        setTimeout(() => playBeep(660, 0.2), t * 1000);
      });
    }

    // ── WAKE LOCK ─────────────────────────────────────────────────
    let wakeLock = null;

    async function requestWakeLock() {
      if (!('wakeLock' in navigator)) return;
      try { wakeLock = await navigator.wakeLock.request('screen'); } catch (_) {}
    }

    function releaseWakeLock() {
      if (wakeLock) { wakeLock.release(); wakeLock = null; }
    }

    document.addEventListener('visibilitychange', () => {
      if (document.visibilityState === 'visible' && tState && !tState.paused) {
        requestWakeLock();
      }
    });

    // ── GYM / HALL ────────────────────────────────────────────────
    const LS_GYM_CACHE  = 'beta7_gyms';
    const LS_GYM_SEL    = 'beta7_gym_sel';
    const GYM_CACHE_TTL = 7 * 24 * 3600 * 1000;
    const FSBASE        = 'https://firestore.googleapis.com/v1/projects/beta7-206508/databases/(default)/documents';

    let gymCache   = null;
    let gymResults = [];

    function gymGetSel() {
      try { return JSON.parse(localStorage.getItem(LS_GYM_SEL)); } catch(_) { return null; }
    }

    function escHtml(s) {
      return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
    }

    function gymUpdateBar() {
      const sel = gymGetSel();
      const el  = document.getElementById('gym-bar-text');
      if (!el) return;
      if (sel) {
        el.className = '';
        el.innerHTML = `<span class="gym-name">${escHtml(sel.label)}</span>`
          + (sel.city ? ` <span class="gym-location">· ${escHtml(sel.city)}</span>` : '');
      } else {
        el.className = 'gym-none';
        el.textContent = 'Keine Halle gewählt';
      }
    }

    function unpackValue(v) {
      if (!v) return null;
      if ('stringValue'  in v) return v.stringValue;
      if ('integerValue' in v) return parseInt(v.integerValue);
      if ('doubleValue'  in v) return v.doubleValue;
      if ('booleanValue' in v) return v.booleanValue;
      if ('arrayValue'   in v) return (v.arrayValue.values || []).map(unpackValue);
      if ('mapValue'     in v) return unpackFields(v.mapValue.fields || {});
      return null;
    }

    function unpackFields(fields) {
      const out = {};
      for (const [k, v] of Object.entries(fields)) out[k] = unpackValue(v);
      return out;
    }

    function normalizeStr(s) {
      return (s || '')
        .normalize('NFKD')
        .replace(/[̀-ͯ]/g, '')
        .replace(/[^\w\s]/g, ' ')
        .toLowerCase()
        .replace(/\s+/g, ' ')
        .trim();
    }

    function gymCacheLoad() {
      try {
        const raw = JSON.parse(localStorage.getItem(LS_GYM_CACHE));
        if (raw && Date.now() - raw.ts < GYM_CACHE_TTL) { gymCache = raw.data; return true; }
      } catch(_) {}
      return false;
    }

    async function gymFetch() {
      const gyms = [];
      let pageToken = null;
      const MASK = 'mask.fieldPaths=displayName&mask.fieldPaths=locationName&mask.fieldPaths=address&mask.fieldPaths=status';
      do {
        const base = `${FSBASE}/locations?pageSize=300&${MASK}`;
        const urlStr = pageToken ? `${base}&pageToken=${encodeURIComponent(pageToken)}` : base;
        const res = await fetch(urlStr);
        if (!res.ok) throw new Error(`HTTP ${res.status}`);
        const json = await res.json();
        for (const doc of (json.documents || [])) {
          const f = unpackFields(doc.fields || {});
          if (f.status && f.status !== 'public') continue;
          const locationId = doc.name.split('/').pop();
          const labelRaw = f.displayName || f.locationName;
          const label = typeof labelRaw === 'string' ? labelRaw
                      : (labelRaw && typeof labelRaw === 'object')
                        ? String(labelRaw.en || labelRaw.de || Object.values(labelRaw)[0] || locationId)
                        : locationId;
          let city = '';
          if (typeof f.address === 'string') city = f.address;
          else if (f.address && typeof f.address === 'object')
            city = String(f.address.city_name || f.address.city || f.address.locality || '');
          gyms.push({ locationId, label, city, normKey: normalizeStr(label + ' ' + city) });
        }
        pageToken = json.nextPageToken || null;
      } while (pageToken);
      gyms.sort((a, b) => a.label.localeCompare(b.label));
      gymCache = gyms;
      localStorage.setItem(LS_GYM_CACHE, JSON.stringify({ ts: Date.now(), data: gyms }));
    }

    function gymSearch(q) {
      if (!gymCache) return [];
      const sel = gymGetSel();
      if (!q.trim()) {
        const list = gymCache.slice();
        if (sel) {
          const idx = list.findIndex(g => g.locationId === sel.locationId);
          if (idx > 0) list.unshift(list.splice(idx, 1)[0]);
        }
        return list.slice(0, 20);
      }
      const tokens = normalizeStr(q).split(' ').filter(Boolean);
      const nq     = normalizeStr(q);
      const hits   = gymCache.filter(g => {
        const key = typeof g.normKey === 'string' ? g.normKey
                  : normalizeStr((g.label || '') + ' ' + (g.city || ''));
        return tokens.every(t => key.includes(t));
      });
      hits.sort((a, b) => {
        const rank = g => {
          const n = normalizeStr(g.label);
          if (n === nq) return 0;
          if (n.startsWith(nq)) return 1;
          if (tokens.some(t => n.startsWith(t))) return 2;
          return 3;
        };
        return rank(a) - rank(b) || a.label.localeCompare(b.label);
      });
      return hits.slice(0, 20);
    }

    function gymRenderList() {
      const q        = document.getElementById('gym-search').value;
      const statusEl = document.getElementById('gym-status');
      const listEl   = document.getElementById('gym-list');
      const sel      = gymGetSel();

      if (!gymCache) {
        statusEl.textContent = 'Hallenliste nicht verfügbar — bitte einmal online öffnen.';
        listEl.innerHTML = '';
        return;
      }
      statusEl.textContent = '';
      gymResults = gymSearch(q);
      if (!gymResults.length) {
        listEl.innerHTML = '<li class="gym-no-results">Keine Treffer.</li>';
        return;
      }
      listEl.innerHTML = gymResults.map((g, i) =>
        `<li class="gym-item" onclick="gymSelect(${i})">` +
        `<div class="gym-item-name${sel && sel.locationId === g.locationId ? ' is-selected' : ''}">${escHtml(g.label)}</div>` +
        (g.city ? `<div class="gym-item-addr">${escHtml(g.city)}</div>` : '') +
        `</li>`
      ).join('');
    }

    function gymSelect(i) {
      const g = gymResults[i];
      localStorage.setItem(LS_GYM_SEL, JSON.stringify(g));
      gymUpdateBar();
      navigate('boulderlog');
    }

    async function gymRefresh() {
      const btn      = document.getElementById('btn-gym-refresh');
      const statusEl = document.getElementById('gym-status');
      btn.textContent = '…';
      btn.disabled    = true;
      statusEl.textContent = 'Lädt …';
      try {
        gymCache = null;
        await gymFetch();
        statusEl.textContent = '';
        gymRenderList();
      } catch(e) {
        statusEl.textContent = 'Hallenliste konnte nicht geladen werden — bitte erneut versuchen.';
        console.error('[gymFetch]', e);
      } finally {
        btn.textContent = 'Aktualisieren';
        btn.disabled    = false;
      }
    }

    async function onGymScreenOpen() {
      document.getElementById('gym-search').value = '';
      if (!gymCache && !gymCacheLoad()) {
        const statusEl = document.getElementById('gym-status');
        statusEl.textContent = 'Lädt …';
        try {
          await gymFetch();
          statusEl.textContent = '';
        } catch(_) {
          statusEl.textContent = 'Hallenliste nicht verfügbar — bitte einmal online öffnen.';
          return;
        }
      }
      gymRenderList();
    }

    // ── QR SCANNER ────────────────────────────────────────────────
    let scanStream = null;

    async function scanStart() {
      if (scanStream) return;
      if (!('BarcodeDetector' in window)) {
        scanShowMsg('QR-Scanner wird von diesem Browser nicht unterstützt (Chrome empfohlen).');
        return;
      }
      let supported;
      try { supported = await BarcodeDetector.getSupportedFormats(); } catch(_) { supported = []; }
      if (!supported.includes('qr_code')) {
        scanShowMsg('QR-Scanner wird von diesem Browser nicht unterstützt (Chrome empfohlen).');
        return;
      }
      try {
        scanStream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: 'environment' } });
      } catch(_) {
        scanShowMsg('Kamerazugriff nicht möglich.');
        return;
      }
      const video = document.getElementById('scanner-video');
      video.srcObject = scanStream;
      await video.play();
      document.getElementById('scanner-overlay').hidden = false;
      scanShowMsg('');

      const detector = new BarcodeDetector({ formats: ['qr_code'] });
      let busy = false;
      function frame() {
        if (!scanStream) return;
        if (busy) { requestAnimationFrame(frame); return; }
        busy = true;
        detector.detect(video).then(codes => {
          if (codes.length > 0) {
            const raw = codes[0].rawValue;
            scanStop();
            handleScanResult(raw);
          } else {
            busy = false;
            requestAnimationFrame(frame);
          }
        }).catch(() => { busy = false; requestAnimationFrame(frame); });
      }
      requestAnimationFrame(frame);
    }

    function scanStop() {
      if (scanStream) { scanStream.getTracks().forEach(t => t.stop()); scanStream = null; }
      document.getElementById('scanner-overlay').hidden = true;
    }

    function scanAbort() { scanStop(); }

    function scanShowMsg(msg) {
      const el = document.getElementById('scan-status');
      if (el) el.textContent = msg;
    }

    // ── FIRESTORE ROUTE FETCH ─────────────────────────────────────
    async function fetchRouteById(routeId) {
      const res = await fetch(`${FSBASE}/routes/${encodeURIComponent(routeId)}`);
      if (res.status === 404) return null;
      if (!res.ok) throw new Error(`HTTP ${res.status}`);
      const json = await res.json();
      return unpackFields(json.fields || {});
    }

    async function fetchRouteByQrcode(qrNum, locationId) {
      const res = await fetch(`${FSBASE}:runQuery`, {
        method:  'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({
          structuredQuery: {
            from:  [{ collectionId: 'routes' }],
            where: { fieldFilter: {
              field: { fieldPath: 'qrcode' },
              op:    'EQUAL',
              value: { integerValue: String(qrNum) }
            }},
            limit: 50
          }
        })
      });
      const rows = await res.json();
      let routes = rows
        .filter(r => r.document)
        .map(r => unpackFields(r.document.fields || {}))
        .filter(r => r.status === 'active');
      if (locationId) {
        const byLoc = routes.filter(r => r.locationId === locationId);
        if (byLoc.length) routes = byLoc;
      }
      if (!routes.length) return null;
      routes.sort((a, b) => (b.time || 0) - (a.time || 0));
      return routes[0];
    }

    async function handleScanResult(raw) {
      const urlMatch = raw.match(/https?:\/\/beta7\.app\/route\/([^/?#\s]+)/);
      const isRawId  = !urlMatch && /^[A-Za-z0-9_-]+~\d+$/.test(raw.trim());
      const isNum    = !urlMatch && !isRawId && /^\d+$/.test(raw.trim());

      if (urlMatch || isRawId) {
        const routeId = urlMatch ? urlMatch[1] : raw.trim();
        scanShowMsg('Lade Route …');
        let route;
        try { route = await fetchRouteById(routeId); }
        catch(_) { scanShowMsg('Abruf fehlgeschlagen — bitte erneut versuchen.'); return; }
        if (!route) { scanShowMsg('Route nicht gefunden.'); return; }
        applyRouteToForm(route);

      } else if (isNum) {
        const sel = gymGetSel();
        if (!sel) { scanShowMsg('Keine Halle gewählt — bitte zuerst eine Halle auswählen.'); return; }
        scanShowMsg('Lade Route …');
        let route;
        try { route = await fetchRouteByQrcode(parseInt(raw.trim()), sel.locationId); }
        catch(_) { scanShowMsg('Abruf fehlgeschlagen — bitte erneut versuchen.'); return; }
        if (!route) { scanShowMsg('Keine aktive Route an dieser Position.'); return; }
        applyRouteToForm(route);

      } else {
        scanShowMsg(`Inhalt kann nicht verarbeitet werden: ${raw}`);
      }
    }

    function applyRouteToForm(route) {
      const grade  = route.grades && route.grades.label ? route.grades.label : '';
      const styles = Array.isArray(route.routeStyles) ? route.routeStyles.join(', ') : '';
      gradeEl.value = grade;
      if (styles) styleEl.value = styles;
      scanShowMsg('');
    }
  </script>
